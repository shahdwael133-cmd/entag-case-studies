<!DOCTYPE html>
<html>
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Entag Case Study Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Akshar:wght@300;400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
/* Entag Case Study Library
   Palette and type from Brand Guidelines/Entag_Brand_Design_System.md
   Akshar for English, Cairo for Arabic (Akshar has no Arabic glyphs). */

:root {
  --green:        #036D35;
  --green-bright: #68D08C;
  --green-light:  #97DFB0;
  --green-pale:   #DCFAE6;
  --ink:          #101828;
  --body:         #475467;
  --border:       #EAECF0;
  --surface:      #F9FAFB;
  --white:        #FFFFFF;
  --amber:        #B54708;
  --amber-bg:     #FFFAEB;
  --radius:       12px;
  --shadow:       0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  --shadow-lift:  0 8px 24px rgba(16,24,40,.10);
}

* { box-sizing: border-box; }

/* "hidden" must always win, even over elements styled as flex (the tabs). */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--surface);
  color: var(--body);
  font-family: 'Akshar', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.55;
}

body[dir="rtl"], #detailBody[dir="rtl"] {
  font-family: 'Cairo', system-ui, 'Segoe UI', sans-serif;
}
/* A case study shown in English while the rest of the page is in Arabic. */
#detailBody[dir="ltr"] {
  font-family: 'Akshar', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

h1, h2, h3 { color: var(--ink); font-weight: 600; margin: 0; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }

/* ---------------------------------------------------------------- header */

.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}
.topbar-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 14px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--green);
  position: relative; flex: none;
}
.brand-mark::after {
  content: ''; position: absolute; inset: 10px;
  border: 2px solid var(--white); border-radius: 3px;
}
.brand-logo { height: 30px; width: auto; display: block; flex: none; }
.brand-text { border-inline-start: 1px solid var(--border); padding-inline-start: 12px; }
.brand-title { color: var(--ink); font-weight: 600; font-size: 18px; line-height: 1.2; }
.brand-sub   { font-size: 13px; color: var(--body); }

.topbar-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tab, .topbar-actions .link-btn { white-space: nowrap; }

.tabs { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 10px; }
.tab {
  border: 0; background: transparent; color: var(--body);
  padding: 7px 15px; border-radius: 8px; cursor: pointer; font-weight: 500;
}
.tab.is-active { background: var(--white); color: var(--ink); box-shadow: var(--shadow); }

.lang-toggle {
  border: 1px solid var(--border); background: var(--white); color: var(--ink);
  padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
}
.lang-toggle:hover { border-color: var(--green-light); }

.nav-arrows { display: flex; gap: 6px; }
.nav-btn {
  border: 1px solid var(--border); background: var(--white); color: var(--ink);
  padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap;
}
.nav-btn:hover:not(:disabled) { border-color: var(--green-light); }
.nav-btn:disabled { opacity: .4; cursor: default; }
#navBack::before { content: '\2039'; margin-inline-end: 6px; }
#navForward::after { content: '\203A'; margin-inline-start: 6px; }
body[dir="rtl"] #navBack::before { content: '\203A'; }
body[dir="rtl"] #navForward::after { content: '\2039'; }

/* ------------------------------------------------------------------ main */

main { max-width: 1180px; margin: 0 auto; padding: 26px 22px 80px; }
.view { animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.page-title { font-size: 30px; margin-bottom: 6px; }
.page-intro { margin: 0 0 6px; max-width: 62ch; }
.note {
  background: var(--green-pale); color: #05502a;
  border-radius: 10px; padding: 10px 14px; margin: 12px 0 22px;
  font-size: 14px; max-width: 62ch;
}

.loading { padding: 40px 0; color: var(--body); }

/* -------------------------------------------------------------- toolbar */

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.search {
  flex: 1 1 280px; min-width: 220px;
  padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--white); color: var(--ink);
}
.search:focus, .filter:focus, .field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-pale);
}
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filter {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--white); color: var(--ink); cursor: pointer;
}
.link-btn {
  border: 0; background: none; color: var(--green); cursor: pointer;
  font-weight: 600; padding: 8px 4px;
}
.link-btn:hover { text-decoration: underline; }
.back { margin-bottom: 14px; display: inline-block; }

.result-count { font-size: 14px; margin-bottom: 14px; }

/* ---------------------------------------------------------------- cards */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
  gap: 18px;
}
.card {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .14s ease, box-shadow .14s ease;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.card-body { padding: 15px 16px 17px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.card-client { color: var(--ink); font-weight: 600; font-size: 17px; line-height: 1.25; }
.card-part { font-size: 14px; }
.card-metric {
  background: var(--green-pale); color: #05502a; border-radius: 8px;
  padding: 7px 11px; font-size: 13px; font-weight: 500; margin-top: auto;
}
.card-metric b { color: var(--green); }
.card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip {
  font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); color: var(--body);
}
.badge { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.badge.draft      { background: var(--surface);    color: var(--body); border: 1px solid var(--border); }
.badge.needs_info { background: var(--amber-bg);   color: var(--amber); }
.badge.approved   { background: var(--green-pale); color: #05502a; }
.badge.published  { background: var(--green);      color: var(--white); }

.empty { text-align: center; padding: 64px 20px; color: var(--body); }
.empty-title { color: var(--ink); font-size: 19px; font-weight: 600; margin-bottom: 6px; }

/* --------------------------------------------------------------- detail */

.detail-head {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; margin-bottom: 18px;
}
.detail-title { font-size: 27px; margin-bottom: 4px; }
.detail-sub { font-size: 15px; margin-bottom: 4px; }
.detail-by { font-size: 13px; color: var(--body); margin-bottom: 14px; }
.card-by { font-size: 12px; color: var(--body); margin-top: 4px; }
.detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

.btn {
  border: 0; border-radius: 9px; padding: 10px 20px; cursor: pointer; font-weight: 600;
}
.btn-primary { background: var(--green); color: var(--white); }
.btn-primary:hover { background: #02592b; }
.btn-primary:disabled { opacity: .6; cursor: default; }
.btn-ghost { background: var(--white); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--green-light); }
.btn-danger { background: var(--white); color: var(--amber); border: 1px solid var(--border); }

.proof-strip {
  display: flex; gap: 26px; flex-wrap: wrap;
  background: var(--green-pale); border-radius: 10px; padding: 16px 20px; margin: 16px 0 0;
}
.proof-item .proof-label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.proof-item .proof-value { color: var(--ink); font-size: 21px; font-weight: 600; }
.proof-arrow { align-self: center; color: var(--green); font-size: 21px; }

.block {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 24px; margin-bottom: 14px;
}
.block h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--body); margin-bottom: 8px; }
.block p { margin: 0; color: var(--ink); white-space: pre-wrap; }
.block.quote p { font-size: 18px; font-style: italic; }
.block .attrib { margin-top: 8px; font-size: 14px; font-style: normal; }

.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.meta-item .meta-label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.meta-item .meta-value { color: var(--ink); font-weight: 500; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.gallery img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }

.flag {
  display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
  background: var(--amber-bg); color: var(--amber); margin-inline-start: 8px; font-weight: 600;
}
.flag.human { background: var(--green-pale); color: #05502a; }
.flag.internal { background: #FEF3F2; color: #B42318; }

.content-lang { display: inline-flex; gap: 4px; background: var(--surface); padding: 3px; border-radius: 8px; }
.content-lang button {
  border: 0; background: transparent; padding: 5px 13px; border-radius: 6px;
  cursor: pointer; color: var(--body); font-weight: 600; font-size: 13px;
}
.content-lang button.is-active { background: var(--white); color: var(--ink); box-shadow: var(--shadow); }

/* ----------------------------------------------------------------- form */

.section {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px 24px; margin-bottom: 16px;
}
.section-title { font-size: 19px; margin-bottom: 4px; }

.field { padding: 16px 0; border-bottom: 1px solid var(--border); }
.field:last-child { border-bottom: 0; padding-bottom: 4px; }
.field-label { color: var(--ink); font-weight: 600; display: block; margin-bottom: 3px; }
.field-req { font-size: 11.5px; font-weight: 600; color: var(--green); margin-inline-start: 7px; }
.field-opt { font-size: 11.5px; color: var(--body); margin-inline-start: 7px; }
.field-help { font-size: 14px; margin-bottom: 10px; max-width: 68ch; }

.field input[type="text"], .field input[type="month"], .field textarea, .field select {
  width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 9px;
  background: var(--white); color: var(--ink);
}
.field textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.field .other-input { margin-top: 10px; border-color: var(--green-light); background: #FCFFFD; }
.field.has-error input, .field.has-error textarea, .field.has-error select { border-color: #D92D20; }
.field-error { color: #D92D20; font-size: 13px; margin-top: 6px; display: none; }
.field.has-error .field-error { display: block; }

.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--border); border-radius: 999px; padding: 8px 15px;
  cursor: pointer; background: var(--white); user-select: none;
}
.check input { accent-color: var(--green); margin: 0; }
.check.is-on { border-color: var(--green); background: var(--green-pale); color: #05502a; }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair > .field { border-bottom: 0; display: flex; flex-direction: column; }
/* Same space under both boxes (the "last question" rule would shrink the second). */
.pair > .field, .pair > .field:last-child { padding-bottom: 16px; }
/* Line the two boxes up even when one helper line is longer than the other. */
.pair > .field > input { margin-top: auto; }
@media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }

.disclosure {
  border: 1px dashed var(--green-light); background: var(--green-pale); color: #05502a;
  border-radius: 10px; padding: 12px 18px; cursor: pointer; font-weight: 600; width: 100%;
}

.readiness {
  border-radius: 10px; padding: 13px 18px; margin-bottom: 18px; font-size: 14px;
  background: var(--amber-bg); color: var(--amber);
}
.readiness.is-ready { background: var(--green-pale); color: #05502a; }
.readiness ul { margin: 6px 0 0; padding-inline-start: 20px; }

.form-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 0 40px; }
.form-msg { font-size: 14px; }

/* --------------------------------------------------------------- upload */

.dropzone {
  border: 2px dashed var(--green-light); background: var(--green-pale);
  border-radius: var(--radius); padding: 30px 20px; text-align: center;
  cursor: pointer; color: #05502a;
}
.dropzone.is-over { border-color: var(--green); background: #cdf5dc; }
.dropzone-hint { font-size: 13px; margin-top: 5px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 14px; }
.thumb { position: relative; }
.thumb img { width: 100%; height: 105px; object-fit: cover; border-radius: 9px; border: 1px solid var(--border); display: block; }
.thumb button {
  position: absolute; top: 6px; inset-inline-end: 6px;
  border: 0; border-radius: 6px; background: rgba(16,24,40,.78); color: #fff;
  font-size: 11.5px; padding: 3px 8px; cursor: pointer;
}

/* ----------------------------------------------------------- post drafts */

.post-panel {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 24px; margin-bottom: 18px;
}
.post-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.post-title { font-size: 19px; }
.post-intro { margin: 0 0 14px; }
.post-warn { background: var(--amber-bg); color: var(--amber); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
.post-link { background: var(--green-pale); color: #05502a; border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; font-size: 13px; }
.post-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
.post-card.is-best { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-pale); }
.post-card-top { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.video-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.video-item {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--white);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
}
.video-top { flex: 1 1 200px; display: flex; justify-content: space-between; gap: 10px; min-width: 0; }
.video-name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.video-status { font-size: 13px; color: var(--body); white-space: nowrap; }
.video-item.is-done .video-status { color: var(--green); }
.video-item.is-failed .video-status { color: var(--amber); }
.video-bar { flex-basis: 100%; height: 4px; border-radius: 4px; background: var(--surface); overflow: hidden; }
.video-fill { height: 100%; background: var(--green); transition: width .2s ease; }
.video-item.is-done .video-bar { display: none; }
.video-link { display: block; padding: 7px 0; color: var(--green); font-weight: 500; text-decoration: none; }
.video-link:hover { text-decoration: underline; }
.video-note { font-size: 13px; margin-top: 6px; }
.flag.anon { background: var(--green-pale); color: #05502a; display: inline-block; align-self: flex-start; width: fit-content; margin: 4px 0 2px; }
.gallery a { display: block; border-radius: 10px; }
.gallery a:hover img, .gallery a:focus img { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-pale); }
.photo-note { font-size: 13px; margin-top: 10px; }
.folder-link { color: var(--green); font-weight: 600; text-decoration: none; }
.folder-link:hover { text-decoration: underline; }
.filling-as { font-size: 13px; color: var(--body); margin: -6px 0 6px; font-weight: 600; }
.save-state { font-size: 13px; color: var(--body); margin: -6px 0 14px; min-height: 18px; }
.save-state.is-saved { color: var(--green); }
.save-state.is-failed { color: var(--amber); }
.post-card > summary { list-style: none; cursor: pointer; flex-wrap: wrap; }
.post-card > summary::-webkit-details-marker { display: none; }
.post-card > summary::after {
  content: '\25BE'; margin-inline-start: auto; color: var(--green); font-size: 16px;
  transition: transform .15s ease;
}
.post-card:not([open]) > summary::after { transform: rotate(-90deg); }
[dir="rtl"] .post-card:not([open]) > summary::after { transform: rotate(90deg); }
.post-peek {
  order: 1; flex-basis: 100%; min-width: 0; margin-top: 4px; font-size: 14px; color: var(--body);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.post-card[open] .post-peek { display: none; }
.post-why { font-size: 13px; margin: 4px 0 10px; }
.post-text {
  white-space: pre-wrap; background: var(--surface); border-radius: 10px;
  padding: 14px 16px; color: var(--ink); line-height: 1.6; font-size: 15px;
}
.post-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.post-comment { margin-top: 10px; font-size: 13px; }
.post-comment code, .post-link code {
  display: block; margin-top: 4px; padding: 8px 10px; background: var(--surface);
  border-radius: 8px; word-break: break-all; font-size: 12.5px; color: var(--ink);
}
.btn-sm { padding: 6px 12px; font-size: 13px; margin-top: 8px; }

/* -------------------------------------------------------------- sign in */

.signin {
  max-width: 440px; margin: 48px auto; background: var(--white);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 30px 28px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px;
}
.signin-input {
  padding: 13px 15px; border: 1px solid var(--border); border-radius: 10px;
  font-size: 20px; letter-spacing: .18em; text-transform: uppercase; text-align: center;
  color: var(--ink);
}
.signin-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-pale); }
.signin-msg { margin: 0; color: #D92D20; font-size: 14px; }

/* ---------------------------------------------------------------- toast */

.toast {
  position: fixed; inset-inline-end: 22px; bottom: 22px;
  background: var(--ink); color: var(--white);
  padding: 12px 20px; border-radius: 10px; box-shadow: var(--shadow-lift);
  z-index: 50; font-weight: 500;
}

@media (max-width: 620px) {
  .topbar-inner { padding: 12px 16px; }
  main { padding: 20px 16px 60px; }
  .brand-sub { display: none; }
  .section, .block, .detail-head { padding-inline: 17px; }
}
</style>

</head>

<body>
  <!-- ------------------------------------------------------------------ -->
  <!-- Header                                                              -->
  <!-- ------------------------------------------------------------------ -->
  <header class="topbar">
    <div class="topbar-inner">

  <main id="main">

    <!-- ---------------------------------------------------------------- -->
    <!-- Sign in                                                           -->
    <!-- ---------------------------------------------------------------- -->
    <section id="viewSignIn" class="view" hidden>
      <form class="signin" id="signInForm" autocomplete="off">

/* Talks to the library's Apps Script by message, in place of google.script.run. */
(function () {
  var API = "https://script.google.com/macros/s/AKfycbyXSo-hea6hie2E-m_fCkmd6_-4Nq9-VYvg9Zja5yYBciRuR1r3VaZifuRZQoxlk7lR/exec";
  var CALLS = ["getBootstrap","getPhotos","saveEntry","deleteEntry","startVideoUpload","uploadVideoChunk","finishVideoUpload"];
  function send(fn, args, ok, fail) {
    fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('NETWORK'); return r.json(); })
      .then(function (m) {
        if (m && m.ok) { if (ok) ok(m.result); return; }
        if (fail) fail(new Error((m && m.error) || 'FAILED'));
      }, function () { if (fail) fail(new Error('NETWORK')); });
  }
  function runner(ok, fail) {
    var r = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    CALLS.forEach(function (name) {
      r[name] = function () { send(name, Array.prototype.slice.call(arguments), ok, fail); };
    });
    return r;
  }
  window.google = { script: {
    run: runner(null, null),
    url: { getLocation: function (cb) {
      var p = {};
      location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf('=');
        var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
        p[k] = decodeURIComponent((i < 0 ? '' : kv.slice(i + 1)).replace(/\+/g, ' '));
      });
      cb({ parameter: p, hash: location.hash.replace(/^#/, '') });
    } }
  } };
})();
</script>

/* Entag Case Study Library — everything that happens in the browser. */

var BOOT = null;                 // fields, wording, dropdown lists, entries
var LANG = 'en';                 // interface language
var CONTENT_LANG = 'en';         // which language of the content the detail view shows
var ENTRIES = [];
var CURRENT = null;              // entry open in the detail view
var EDITING = null;              // entry being edited, or null for a new one
var PENDING = {};                // everything typed so far, in both languages
var NEW_PHOTOS = [];             // [{name, mimeType, dataBase64, preview}]
var KEPT_PHOTOS = [];            // [{id, name, url}] already on the entry
var REMOVED_PHOTOS = [];
var DRAFT_KEY = 'entag_cs_draft';
var LANG_KEY = 'entag_cs_lang';
var CODE_KEY = 'entag_cs_code';
var CODE = '';                   // this person's team code
var WIRED = false;
var NAV = makeHistory();
var POST_OPEN = false;            // is the post-drafts panel open?
var POST_PLATFORM = 'linkedin';       // screens visited, for Back / Forward

// ---------------------------------------------------------------- helpers

function S(key) {
  var packs = BOOT ? BOOT.strings : PRELOAD_STRINGS;
  return (packs[LANG] && packs[LANG][key]) || key;
}

function FT(key, part) {
  var t = BOOT.fieldText[key];
  if (!t) return key;
  return (t[LANG] && t[LANG][part]) || (t.en && t.en[part]) || key;
}

function listLabel(listName, value) {
  var list = BOOT.lists[listName] || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].value === value) return list[i][LANG] || list[i].en;
  }
  return value;
}

/** Label for a chosen option; "Other" shows what the person typed instead. */
function optionText(entry, key, listName, value) {
  var typed = String(entry[key + '_other'] || '').trim();
  if (value === 'other' && typed) return typed;
  return listLabel(listName, value);
}

/** Does this question's list have an "Other" option? */
function hasOther(f) {
  return (BOOT.lists[f.options] || []).some(function (o) { return o.value === 'other'; });
}

/** The "type it here" box that appears when Other / Something else is picked. */
function otherBox(f, entry, prefill) {
  var input = document.createElement('input');
  input.type = 'text';
  input.name = f.key + '_other';
  input.className = 'other-input';
  input.placeholder = S('otherPlaceholder');
  if (prefill && prefill[input.name] !== undefined) input.value = prefill[input.name];
  else if (entry) input.value = entry[input.name] || '';
  input.addEventListener('input', onFormChange);
  return input;
}

function fieldDef(key) {
  for (var i = 0; i < BOOT.fields.length; i++) if (BOOT.fields[i].key === key) return BOOT.fields[i];
  return null;
}

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(t._timer);
  t._timer = setTimeout(function () { t.hidden = true; }, 2600);
}

/** The side of a bilingual field to show, preferring the requested language. */
function bilingual(entry, key, lang) {
  var want = String(entry[key + '_' + lang] || '').trim();
  var other = lang === 'en' ? 'ar' : 'en';
  var src = entry[key + '_src'] || '';
  if (want) return { text: want, auto: src && src !== 'both' && src !== lang };
  var fallback = String(entry[key + '_' + other] || '').trim();
  return { text: fallback, auto: false };
}

window.addEventListener('DOMContentLoaded', function () {
  try { LANG = localStorage.getItem(LANG_KEY) || 'en'; } catch (e) { LANG = 'en'; }
  try { CODE = localStorage.getItem(CODE_KEY) || ''; } catch (e) { CODE = ''; }
  wireShell();
  applyLanguage();
  // A personal link (the library link + ?code=CODE) signs the person in with nothing
  // to type, even on a browser that forgets what the page saved.
  linkCode(function (fromLink) {
    if (fromLink) {
      CODE = fromLink;
      try { localStorage.setItem(CODE_KEY, CODE); } catch (e) {}
    }
    if (CODE) loadLibrary(); else showSignIn('');

});

/** Calls done(code) with the code in the page's address, or done('') if none. */
function linkCode(done) {
  var called = false;
  var give = function (code) { if (called) return; called = true; done(code); };
  setTimeout(function () { give(''); }, 3000); // never leave the page waiting
  try {
    google.script.url.getLocation(function (loc) {
      var c = loc && loc.parameter && loc.parameter.code; // not "c": Google reserves it
      give(c ? String(c).replace(/\s+/g, '').toUpperCase() : '');
    });
  } catch (e) { give(''); }
}

function signIn(ev) {
  ev.preventDefault();
  CODE = document.getElementById('signInCode').value.replace(/\s+/g, '').toUpperCase();
  if (!CODE) return;

/** The Sign out button: asks first, so nobody signs out by accident. */
function askSignOut() {
  if (window.confirm(S('signOutConfirm'))) signOut();
}

function signOut() {
  CODE = '';
  BOOT = null;
  try { localStorage.removeItem(CODE_KEY); } catch (e) {}
  document.getElementById('signInCode').value = '';
  applyLanguage();
  showSignIn('');
}

function onBoot(data) {
  BOOT = data;
  ENTRIES = data.entries || [];
  document.getElementById('loading').hidden = true;
  document.getElementById('tabs').hidden = false;
  document.getElementById('signOutBtn').hidden = false;
  document.getElementById('navArrows').hidden = false;

  buildFilters();
  renderLibrary();
  NAV = makeHistory();

}

function onBootFail(err) {
  var msg = String(err && err.message || '');
  if (msg.indexOf('NOT_ALLOWED') > -1) {
    try { localStorage.removeItem(CODE_KEY); } catch (e) {}
    CODE = '';
    showSignIn('signInWrong');
  } else if (msg.indexOf('TOO_MANY_TRIES') > -1) {
    showSignIn('signInTooMany');
  } else {
    document.getElementById('loading').textContent = S('errLoadFailed');
  }
}

/** The list of screens visited, so Back and Forward work like a browser. */
function makeHistory() {
  var stack = [];
  var pos = -1;
  function same(a, b) { return !!a && !!b && a.view === b.view && (a.id || null) === (b.id || null); }
  return {
    push: function (st) {
      if (same(stack[pos], st)) return;
      stack = stack.slice(0, pos + 1);
      stack.push(st);
      pos = stack.length - 1;
    },
    back: function () { if (pos > 0) pos--; return stack[pos]; },
    forward: function () { if (pos < stack.length - 1) pos++; return stack[pos]; },
    canBack: function () { return pos > 0; },
    canForward: function () { return pos < stack.length - 1; },
    current: function () { return stack[pos]; }
  };
}

// The screen someone is on is kept in the browser, so a refresh drops them
// back there (the form they were filling in, or the case study they had open).
var SCREEN_KEY = 'entag_cs_screen';

// Kept for this tab only: a refresh goes back to where you were, but opening the
// link fresh (a new tab, or the next day) always starts on the library.
function rememberScreen(st) {
  try { sessionStorage.setItem(SCREEN_KEY, JSON.stringify({ view: st.view, id: st.id || null })); } catch (e) {}
}

function restoredScreen() {
  try {
    var st = JSON.parse(sessionStorage.getItem(SCREEN_KEY) || 'null');
    if (!st || (st.id && !findEntry(st.id))) return null; // e.g. deleted meanwhile
    return st;
  } catch (e) { return null; }
}

/** Go to a screen and remember it. */
function navTo(st) {
  NAV.push(st);
  applyState(st);
}

/** Draw a screen without touching the history. */
function applyState(st) {
  leaveForm();
  if (st.view === 'detail' && findEntry(st.id)) openDetail(st.id);
  else if (st.view === 'form' && st.id && findEntry(st.id)) startEdit(findEntry(st.id));
  else if (st.view === 'form' && !st.id) startNew();
  else show('viewLibrary');
  rememberScreen(st);
  updateNavButtons();
}

function findEntry(id) {
  return ENTRIES.filter(function (e) { return e.id === id; })[0] || null;
}

function updateNavButtons() {
  document.getElementById('navBack').disabled = !NAV.canBack();
  document.getElementById('navForward').disabled = !NAV.canForward();
}

function navBack() { applyState(NAV.back()); }
function navForward() { applyState(NAV.forward()); }


function show(view) {
  ['viewLibrary', 'viewDetail', 'viewForm'].forEach(function (v) {
    document.getElementById(v).hidden = (v !== view);

  document.getElementById('tabLibrary').classList.toggle('is-active', view === 'viewLibrary');
  document.getElementById('tabAdd').classList.toggle('is-active', view === 'viewForm');

function filtered() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  var cap = document.getElementById('fCapability').value;
  var ind = document.getElementById('fIndustry').value;
  var st = document.getElementById('fStatus').value;
  var yr = document.getElementById('fYear').value;

  return ENTRIES.filter(function (e) {
    if (cap && String(e.capabilities || '').indexOf(cap) === -1) return false;
    if (ind && e.industry !== ind) return false;
    if (st && e.status !== st) return false;
    if (yr && String(e.delivery_month || '').substring(0, 4) !== yr) return false;
    if (!q) return true;
    var hay = [
      e.client_name, e.part_made_en, e.part_made_ar, e.material_en, e.material_ar,
      e.problem_en, e.problem_ar, e.solution_en, e.solution_ar, e.id
    ].join(' ').toLowerCase();
    return hay.indexOf(q) > -1;
  });
}
