/**
 * Turns a case study into ready post drafts, best bet first.
 * Built from Entag's own evidence (Documents/entag_competitor_social_analysis.md and
 * Entag SEO/07_Templates/entag-caption-prompt-template.md): lead with one concrete
 * number, then the problem, what Entag did, the proof; LinkedIn links go in the
 * first comment, Instagram uses "link in bio"; 3 to 4 hashtags; verified claims only.
 * All sentences come from the wording in Strings.gs, in the language asked for.
 */
function buildPosts(entry, lang, platform) {
  var T = BOOT.strings[lang] || BOOT.strings.en;
  var out = { blocked: false, warnings: [], drafts: [], bioLink: '' };
  if (entry.usage_permission === 'internal') { out.blocked = true; return out; }

  var machine = false;
  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; });
  }
  function sentence(t) {
    t = String(t || '').trim();
    if (!t) return '';
    return /[.!?\u061F\u2026]$/.test(t) ? t : t + '.';
  }
  function lower(t) {
    // Only English has capitals. Keep acronyms (CNC) and names as they are.
    t = String(t || '').trim();
    if (lang !== 'en' || t.length < 2 || t.charAt(1) !== t.charAt(1).toLowerCase()) return t;
    return t.charAt(0).toLowerCase() + t.slice(1);
  }
  function label(listName, key, value) {
    var typed = String(entry[key + '_other'] || '').trim();
    if (value === 'other' && typed) return typed;
    var list = BOOT.lists[listName] || [];
    for (var i = 0; i < list.length; i++) if (list[i].value === value) return list[i][lang] || list[i].en;
    return String(value || '');
  }
  function text(key) {
    var v = bilingual(entry, key, lang);
    if (v.text && v.auto) machine = true;
    return v.text;
  }
  function join(parts) {
    return parts.filter(function (p) { return String(p || '').trim(); }).join('\n\n');
  }

  // Who: the client's name only if we're allowed to use it.
  var who, whoMid;
  if (entry.usage_permission === 'public' && String(entry.client_name || '').trim()) {
    who = whoMid = String(entry.client_name).trim();
  } else {
    var industry = label('industry', 'industry', entry.industry);
    who = fill(T.anonymisedClient, { industry: lang === 'en' ? industry.toLowerCase() : industry });
    if (lang === 'en' && /^A [aeiou]/i.test(who)) who = 'An' + who.slice(1);
    whoMid = lang === 'en' ? who.charAt(0).toLowerCase() + who.slice(1) : who;
  }

  var metric = label('metric', 'metric_type', entry.metric_type);
  var vars = {
    who: who, whoMid: whoMid,
    part: lower(text('part_made')),
    metric: metric, metricMid: lang === 'en' ? metric.toLowerCase() : metric,
    before: String(text('metric_before') || '').trim(),
    after: String(text('metric_after') || '').trim()
  };
  var problem = sentence(text('problem'));
  var solution = sentence(text('solution'));
  var hasNumber = !!(entry.metric_type && vars.before && vars.after);

  var quoteBlock = '';
  if (entry.quote_approved === 'yes') {
    var quote = text('client_quote');
    if (quote) {
      var by = entry.usage_permission === 'public' && String(entry.quote_author || '').trim()
        ? String(entry.quote_author).trim() : who;
      // Arabic: start each line with a right-to-left mark so the quote marks and
      // the "- name" stay on the right side when pasted.
      var rtl = lang === 'ar' ? '\u200F' : '';
      quoteBlock = rtl + '\u201C' + quote + '\u201D\n' + rtl + '- ' + by;
    }
  }

  var picked = String(entry.difficulty || '').split(',').map(function (v) { return v.trim(); });
  var moq = picked.indexOf('low_volume') > -1 ? T.tplMoq : '';
  var repeat = entry.repeat_orders === 'yes' ? T.tplRepeat : '';
  var result = hasNumber ? fill(T.tplResult, vars) : '';

  var link = 'https://app.entag.co/get-a-quote?utm_source=' + platform +
    '&utm_medium=social&utm_campaign=case_study_' + String(entry.id || '').toLowerCase();
  var cta = platform === 'instagram' ? T.tplCtaInstagram : T.tplCtaLinkedIn;
  var comment = platform === 'linkedin' ? fill(T.tplComment, { link: link }) : '';
  if (platform === 'instagram') out.bioLink = link;

  var CAP_TAGS = {
    cnc: '#CNCMachining', sheet_metal: '#SheetMetal', tube: '#TubeFabrication',
    printing_fdm: '#3DPrinting', printing_sla: '#3DPrinting', printing_slm: '#3DPrinting',
    finishing: '#MetalFinishing', assembly: '#Assembly'
  };
  var tags = ['#Entag', '#OnDemandManufacturing'];
  var caps = String(entry.capabilities || '').split(',').map(function (v) { return v.trim(); });
  for (var c = 0; c < caps.length; c++) if (CAP_TAGS[caps[c]]) { tags.push(CAP_TAGS[caps[c]]); break; }
  tags.push('#CaseStudy');
  // Arabic: hashtags are English, so mark the line left-to-right or the first # jumps to the end.
  var tagLine = (lang === 'ar' ? '\u200E' : '') + tags.join(' ');

  if (hasNumber) {
    out.drafts.push({ principle: 'specificity', text: join([
      fill(T.tplHookNumber, vars), fill(T.tplNeeded, vars) + ' ' + problem, solution, quoteBlock, moq, cta, tagLine
    ]) });
  }
  out.drafts.push({ principle: 'loss', text: join([
    problem, fill(T.tplWhere, vars), solution, result, moq, repeat, cta, tagLine
  ]) });
  out.drafts.push({ principle: 'proof', text: quoteBlock
    ? join([quoteBlock, fill(T.tplCameWith, vars) + ' ' + problem, solution, result, repeat, cta, tagLine])
    : join([fill(T.tplHow, vars), problem, solution, result, repeat, cta, tagLine]) });

  out.drafts.forEach(function (d, i) { d.best = i === 0; d.firstComment = comment; });
  if (entry.client_name === 'Sample') out.warnings.push('postSample');
  if (!hasNumber) out.warnings.push('postNoNumber');
  if (machine) out.warnings.push('postMachineText');
  return out;
}

var POST_FOLDS = {};

function togglePostPanel() {
  POST_OPEN = !POST_OPEN;
  var panel = document.getElementById('postPanel');
  if (!panel) return;
  panel.hidden = !POST_OPEN;
  if (POST_OPEN) {
    renderPostPanel();
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderPostPanel() { inContentLang(drawPostPanel); }

function drawPostPanel() {
  var panel = document.getElementById('postPanel');
  if (!panel || !CURRENT) return;
  panel.innerHTML = '';
  var r = buildPosts(CURRENT, CONTENT_LANG, POST_PLATFORM);

  var head = el('div', 'post-head');
  head.appendChild(el('h3', 'post-title', S('postTitle')));
  var sw = el('div', 'content-lang post-platform');
  ['linkedin', 'instagram'].forEach(function (pf) {
    var b = el('button', pf === POST_PLATFORM ? 'is-active' : '', S(pf === 'linkedin' ? 'postLinkedIn' : 'postInstagram'));
    b.addEventListener('click', function () { POST_PLATFORM = pf; renderPostPanel(); });
    sw.appendChild(b);
  });
  head.appendChild(sw);
  panel.appendChild(head);

  if (r.blocked) { panel.appendChild(el('div', 'post-warn', S('postBlocked'))); return; }
  panel.appendChild(el('p', 'post-intro', S('postIntro')));
  r.warnings.forEach(function (w) { panel.appendChild(el('div', 'post-warn', S(w))); });

  if (r.bioLink) {
    var bio = el('div', 'post-link');
    bio.appendChild(el('div', '', S('postBioLink')));
    bio.appendChild(el('code', '', r.bioLink));
    var bl = el('button', 'btn btn-ghost btn-sm', S('postCopyLink'));
    bl.addEventListener('click', function () { copyText(r.bioLink); toast(S('copied')); });
    bio.appendChild(bl);
    panel.appendChild(bio);
  }

  var NAMES = {
    specificity: ['postSpecificity', 'postWhySpecificity'],
    loss: ['postLoss', 'postWhyLoss'],
    proof: ['postProof', 'postWhyProof']
  };
  r.drafts.forEach(function (d) {
    // Folded up so all three fit on one screen. The best bet starts open, and
    // whatever you open or close stays that way when you switch platform.
    var card = document.createElement('details');
    card.className = 'post-card' + (d.best ? ' is-best' : '');
    var fold = CURRENT.id + ':' + d.principle;
    card.open = fold in POST_FOLDS ? POST_FOLDS[fold] : !!d.best;
    card.addEventListener('toggle', function () { POST_FOLDS[fold] = card.open; });
    var top = el('summary', 'post-card-top');
    if (d.best) top.appendChild(el('span', 'badge published', S('postBest')));
    top.appendChild(el('strong', '', S(NAMES[d.principle][0])));
    var peek = el('span', 'post-peek', d.text.split('\n')[0]);
    peek.setAttribute('dir', CONTENT_LANG === 'ar' ? 'rtl' : 'ltr');
    top.appendChild(peek);
    card.appendChild(top);
    card.appendChild(el('div', 'post-why', S(NAMES[d.principle][1])));
    var body = el('div', 'post-text', d.text);
    body.setAttribute('dir', CONTENT_LANG === 'ar' ? 'rtl' : 'ltr');
    card.appendChild(body);

    var actions = el('div', 'post-actions');
    var cp = el('button', 'btn btn-primary', S('postCopy'));
    cp.addEventListener('click', function () { copyText(d.text); toast(S('copied')); });
    actions.appendChild(cp);
    if (d.firstComment) {
      var cc = el('button', 'btn btn-ghost', S('postCopyComment'));
      cc.addEventListener('click', function () { copyText(d.firstComment); toast(S('copied')); });
      actions.appendChild(cc);
    }
    card.appendChild(actions);

    if (d.firstComment) {
      var fc = el('div', 'post-comment');
      fc.appendChild(el('div', '', S('postFirstComment')));
      fc.appendChild(el('code', '', d.firstComment));
      card.appendChild(fc);
    }
    panel.appendChild(card);
  });
}

function copyText(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

// ------------------------------------------------------------------- form

function startNew() {
  EDITING = null;
  NEW_PHOTOS = [];
  KEPT_PHOTOS = [];
  REMOVED_PHOTOS = [];
  KEPT_VIDEOS = [];
  REMOVED_VIDEOS = [];
  KEPT_FILES = [];
  REMOVED_FILES = [];
  var draft = readDraft('');
  PENDING = draft || {};
  FORM = newFormSession('', draft ? (draftRecord() || {}).key : '');
  renderForm(null, draft);
  setSaveState('needBasics');
  if (draft) toast(S('draftRestored'));
  show('viewForm');
  if (draft && !basicsMissing(draft).length) scheduleAutosave();
}

function startEdit(entry) {
  EDITING = entry;
  NEW_PHOTOS = [];
  REMOVED_PHOTOS = [];
  KEPT_VIDEOS = videosOf(entry);
  REMOVED_VIDEOS = [];
  KEPT_FILES = filesOf(entry);
  REMOVED_FILES = [];
  // Anything typed here that hadn't reached Google yet (e.g. a refresh right
  // after typing) comes back from the browser's copy.
  var draft = readDraft(entry.id);
  PENDING = draft || {};
  KEPT_PHOTOS = (PHOTO_CACHE[entry.id] || []).slice();
  FORM = newFormSession(entry.id);
  renderForm(entry, draft);
  setSaveState(draft ? 'saving' : 'saved');
  show('viewForm');
  if (draft) { toast(S('draftRestored')); scheduleAutosave(); }
  if (!PHOTO_CACHE[entry.id]) fetchKeptPhotos(entry.id, FORM);
}

/** Opening Edit straight away (e.g. after a refresh): fetch the photos it already has. */
function fetchKeptPhotos(id, f) {
  google.script.run.withSuccessHandler(function (list) {
    PHOTO_CACHE[id] = list || [];
    if (FORM !== f) return;
    (list || []).forEach(function (p) {
      var known = KEPT_PHOTOS.some(function (k) { return k.id === p.id; });
      if (!known && REMOVED_PHOTOS.indexOf(p.id) === -1) KEPT_PHOTOS.push(p);
    });
    renderThumbs();
    updateReadiness();
  }).getPhotos(CODE, id);
}

function renderForm(entry, prefill) {
  document.getElementById('formTitle').textContent = entry ? S('formTitleEdit') : S('formTitleNew');
  document.getElementById('fillingInAs').textContent = S('fillingInAs').replace('{name}', personName(BOOT.user));
  document.getElementById('marketingSection').hidden = !entry;

  var groups = { core: 'groupCore', proof: 'groupProof', photos: 'groupPhotos', optional: 'groupOptional', extra: 'groupExtra', marketing: 'groupMarketing' };
  Object.keys(groups).forEach(function (g) { document.getElementById(groups[g]).innerHTML = ''; });

  BOOT.fields.forEach(function (f) {
    var host = document.getElementById(groups[f.group]);
    if (!host) return;
    var node = buildField(f, entry, prefill);
    if (f.key === 'metric_before') {
      var pair = el('div', 'pair');
      pair.id = 'metricPair';
      host.appendChild(pair);
      pair.appendChild(node);
    } else if (f.key === 'metric_after' && document.getElementById('metricPair')) {
      document.getElementById('metricPair').appendChild(node);
    } else {
      host.appendChild(node);
    }
  });

  var toggle = document.getElementById('optionalToggle');
  var box = document.getElementById('groupOptional');
  box.hidden = true;
  toggle.textContent = S('optionalToggleShow');

  updateReadiness();
  document.getElementById('formMsg').textContent = '';
}

/** "Added by Shahd · Last edited by Omar", under a case study's title. */
function whoLine(e) {
  var line = S('addedBy') + ': ' + (personName(e.created_by) || '-');
  if (e.updated_by && e.updated_by !== e.created_by) line += '  ·  ' + S('lastEdited') + ': ' + personName(e.updated_by);
  return line;
}

/** "omar" in the Team tab shows as "Omar". */
function personName(name) {
  name = String(name || '').trim();
  return name.charAt(0).toUpperCase() + name.slice(1);
}

function buildField(f, entry, prefill) {
  var wrap = el('div', 'field');
  wrap.setAttribute('data-key', f.key);

  var label = el('label', 'field-label', FT(f.key, 'label'));
  // Only the client name and what we made have to be filled in.
  label.appendChild(el('span', f.mustFill ? 'field-req' : 'field-opt',
    f.mustFill ? S('required') : S('optional')));
  wrap.appendChild(label);
  var help = el('div', 'field-help', isMetricSide(f.key) ? metricHelp(f.key) : FT(f.key, 'help'));
  if (isMetricSide(f.key)) help.setAttribute('data-metric-help', f.key);
  wrap.appendChild(help);

  var stored = f.bilingual ? (f.key + '_' + LANG) : f.key;
  var value = '';
  if (prefill && prefill[stored] !== undefined) value = prefill[stored];
  else if (entry) value = entry[stored] || '';

  if (f.bilingual && entry) {
    var side = bilingual(entry, f.key, LANG);
    if (side.auto && !value) value = side.text;
    if (side.auto) wrap.appendChild(el('span', 'flag', S('autoTranslated')));
  }

  if (f.type === 'text' || f.type === 'month') {
    var input = document.createElement('input');
    input.type = f.type === 'month' ? 'month' : 'text';
    input.name = stored;
    input.value = value;
    input.addEventListener('input', onFormChange);
    wrap.appendChild(input);

  } else if (f.type === 'textarea') {
    var ta = document.createElement('textarea');
    ta.name = stored;
    ta.value = value;
    ta.addEventListener('input', onFormChange);
    wrap.appendChild(ta);

  } else if (f.type === 'select') {
    var sel = document.createElement('select');
    sel.name = stored;
    sel.appendChild(new Option(S('selectPlaceholder'), ''));
    (BOOT.lists[f.options] || []).forEach(function (o) {
      sel.appendChild(new Option(o[LANG] || o.en, o.value));
    });
    sel.value = value;
    sel.addEventListener('change', onFormChange);
    wrap.appendChild(sel);
    if (hasOther(f)) {
      var otherSel = otherBox(f, entry, prefill);
      otherSel.hidden = sel.value !== 'other';
      sel.addEventListener('change', function () {
        otherSel.hidden = sel.value !== 'other';
        if (!otherSel.hidden) otherSel.focus();
      });
      wrap.appendChild(otherSel);
    }

  } else if (f.type === 'multi') {
    var chosen = String(value || '').split(',').map(function (v) { return v.trim(); });
    var box = el('div', 'checks');
    box.setAttribute('data-name', stored);
    (BOOT.lists[f.options] || []).forEach(function (o) {
      var lab = el('label', 'check' + (chosen.indexOf(o.value) > -1 ? ' is-on' : ''));
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = o.value;
      cb.checked = chosen.indexOf(o.value) > -1;
      cb.addEventListener('change', function () {
        lab.classList.toggle('is-on', cb.checked);
        onFormChange();
      });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(o[LANG] || o.en));
      box.appendChild(lab);
    });
    wrap.appendChild(box);
    if (hasOther(f)) {
      var otherMulti = otherBox(f, entry, prefill);
      var otherCb = box.querySelector('input[value="other"]');
      otherMulti.hidden = !otherCb.checked;
      otherCb.addEventListener('change', function () {
        otherMulti.hidden = !otherCb.checked;
        if (!otherMulti.hidden) otherMulti.focus();
      });
      wrap.appendChild(otherMulti);
    }

  } else if (f.type === 'files') {
    wrap.appendChild(buildUpload());
  } else if (f.type === 'videos') {
    wrap.appendChild(buildVideoUpload());
  } else if (f.type === 'documents') {
    wrap.appendChild(buildFileUpload());
  }

  wrap.appendChild(el('div', 'field-error', S('errRequired')));
  return wrap;
}

// ----------------------------------------------------------------- upload

function buildUpload() {
  var host = el('div');

  var zone = el('div', 'dropzone');
  zone.appendChild(el('div', '', S('uploadPrompt')));
  zone.appendChild(el('div', 'dropzone-hint', S('uploadHint')));

  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true;
  input.style.display = 'none';

  zone.addEventListener('click', function () { input.click(); });
  zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
  zone.addEventListener('drop', function (ev) {
    ev.preventDefault();
    zone.classList.remove('is-over');
    handleFiles(ev.dataTransfer.files);
  });
  input.addEventListener('change', function () { handleFiles(input.files); input.value = ''; });

  host.appendChild(zone);
  host.appendChild(input);
  host.appendChild(el('div', 'thumbs', ''));
  host.lastChild.id = 'thumbs';
  setTimeout(renderThumbs, 0);
  return host;
}

function handleFiles(files) {
  if (!files || !files.length) return;
  toast(S('uploadProcessing'));
  var all = Array.prototype.slice.call(files);
  var isImage = function (f) { return /^image\//.test(f.type); };
  // Files the browser can't open (e.g. iPhone HEIC photos on a laptop) are named
  // in a message instead of silently disappearing.
  var failed = all.filter(function (f) { return !isImage(f); }).map(function (f) { return f.name; });
  var queue = all.filter(isImage);
  var pending = queue.length;
  var session = FORM;
  PREPARING += queue.length;
  var finish = function () {
    renderThumbs();
    onFormChange();
    if (failed.length) toast(S('uploadUnreadable').replace('{names}', failed.join(', ')));
  };
  if (!pending) { finish(); return; }
  queue.forEach(function (file) {
    shrink(file, 1600, 0.82, function (dataUrl) {
      if (!dataUrl) {
        failed.push(file.name);
      } else if (FORM === session) { // not if they've already left this form
        NEW_PHOTOS.push({
          name: file.name,
          mimeType: 'image/jpeg',
          dataBase64: dataUrl.split(',')[1],
          preview: dataUrl
        });
      }
      if (--pending === 0) finish();
      if (--PREPARING === 0) photosReady();
    });
  });
}

// ----------------------------------------------------------------- videos
// Up to 1 minute each, as many as you like. They go into the case study's Drive
// folder in pieces, one video at a time, while people keep writing.

var VIDEO_MAX_SECONDS = 60;
var VIDEO_UNKNOWN_MAX_BYTES = 300 * 1024 * 1024; // length can't be read: only take smaller files
// 1 MB pieces (a multiple of 256 KB, as Google requires). On the office laptop's
// connection (about 1 Mbit/s up, measured) an 8 MB piece showed 0% for over a
// minute; 1 MB moves the bar every few seconds.
var VIDEO_CHUNK_BYTES = 1024 * 1024;
// Pieces sent straight from the page to Drive: the bar moves as bytes go, so they
// can be bigger. 2 MB keeps a save from waiting long behind one.
var VIDEO_DIRECT_BYTES = 2 * 1024 * 1024;

// Videos are made smaller in the browser before they go up: played muted (no
// sound comes out, and no click is needed) and recorded again at about 2.5 Mbit/s.
// Tested in Chrome: a 9.1 MB 1080p clip became 1.7 MB, still 1080p, sound kept,
// taking about as long as the clip itself. Anything that goes wrong: the
// original is sent instead.
var VIDEO_TARGET_BPS = 2500000;
var VIDEO_SHRINK_ABOVE_BPS = 3500000; // already smaller than this: sent as it is

function shrinkType() {
  var types = ['video/mp4;codecs=avc1.42E01F,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  for (var i = 0; i < types.length; i++) if (MediaRecorder.isTypeSupported(types[i])) return types[i];
  return '';
}

/** Calls done(file) with a smaller copy of u.file, or done(null) to send the original. */
function shrinkVideo(u, onProgress, done) {
  var type = shrinkType();
  var bps = u.seconds ? u.size * 8 / u.seconds : Infinity;
  var v = document.createElement('video');
  if (!type || !v.captureStream || bps < VIDEO_SHRINK_ABOVE_BPS) return done(null);
  var url = URL.createObjectURL(u.file);
  var finished = false, rec = null, parts = [], timer = null;
  // A clip that stalls (say the page was hidden a long time) is sent as it is.
  var giveUp = setTimeout(function () { end(null); }, Math.max(30, (u.seconds || 60) * 3) * 1000);
  var end = function (file) {
    if (finished) return;
    finished = true;
    clearTimeout(giveUp);
    clearInterval(timer);
    try { if (rec && rec.state !== 'inactive') rec.stop(); } catch (e) { /* already stopped */ }
    try { v.pause(); } catch (e) { /* fine */ }
    URL.revokeObjectURL(url);
    done(file);
  };
  v.muted = true;
  v.playsInline = true;
  v.onerror = function () { end(null); };
  v.onloadedmetadata = function () {
    try {
      rec = new MediaRecorder(v.captureStream(), { mimeType: type, videoBitsPerSecond: VIDEO_TARGET_BPS, audioBitsPerSecond: 128000 });
    } catch (e) { return end(null); }
    rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) parts.push(ev.data); };
    rec.onerror = function () { end(null); };
    rec.onstop = function () {
      if (finished) return;
      var blob = new Blob(parts, { type: rec.mimeType || type });
      if (!blob.size || blob.size >= u.size) return end(null); // not worth it
      var mime = String(blob.type).split(';')[0];
      var name = String(u.name).replace(/\.[^.]*$/, '') + (/mp4/.test(mime) ? '.mp4' : '.webm');
      var file;
      try { file = new File([blob], name, { type: mime }); } catch (e) { return end(null); }
      end(file);
    };
    v.onended = function () { if (rec.state !== 'inactive') rec.stop(); };
    var started = function () {
      rec.start(1000);
      timer = setInterval(function () {
        if (u.cancelled) return end(null);
        if (v.duration) onProgress(Math.min(99, Math.round(100 * v.currentTime / v.duration)));
      }, 500);
    };
    var p = v.play();
    if (p && p.then) p.then(started, function () { end(null); }); else started();
  };
  v.src = url;
}
var KEPT_VIDEOS = [];    // [{id, name}] already on the case study in the form
var REMOVED_VIDEOS = []; // ids to take off on the next save
var UPLOADS = [];        // videos on their way up, from any form opened since the page loaded
var VIDEO_BUSY = false;

function videosOf(entry) {
  var ids = String(entry.video_ids || '').split(',').filter(String);
  var names = String(entry.video_names || '').split('|');
  return ids.map(function (id, i) { return { id: id, name: names[i] || id }; });
}

function videosUploading() {
  return UPLOADS.some(function (u) { return u.state === 'waiting' || u.state === 'shrinking' || u.state === 'uploading'; });
}

function buildVideoUpload() {
  var host = el('div');
  var zone = el('div', 'dropzone');
  zone.appendChild(el('div', '', S('videoPrompt')));
  zone.appendChild(el('div', 'dropzone-hint', S('videoHint')));

  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/*';
  input.multiple = true;
  input.style.display = 'none';

  zone.addEventListener('click', function () { input.click(); });
  zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
  zone.addEventListener('drop', function (ev) {
    ev.preventDefault();
    zone.classList.remove('is-over');
    handleVideos(ev.dataTransfer.files);
  });
  input.addEventListener('change', function () { handleVideos(input.files); input.value = ''; });

  host.appendChild(zone);
  host.appendChild(input);
  var list = el('div', 'video-list');
  list.id = 'videoList';
  host.appendChild(list);
  setTimeout(renderVideoList, 0);
  return host;
}

// ------------------------------------------------------------------ files
// Drawings, CAD and any other document (PDF, DWG, DXF, STEP, STL...). They take
// the same road as videos, without the shrinking or the length check.

var FILE_MAX_BYTES = 1024 * 1024 * 1024; // the server's limit too
var KEPT_FILES = [];    // [{id, name}] already on the case study in the form
var REMOVED_FILES = []; // ids to take off on the next save

function filesOf(entry) {
  var ids = String(entry.file_ids || '').split(',').filter(String);
  var names = String(entry.file_names || '').split('|');
  return ids.map(function (id, i) { return { id: id, name: names[i] || id }; });
}

function buildFileUpload() {
  var host = el('div');
  var zone = el('div', 'dropzone');
  zone.appendChild(el('div', '', S('filesPrompt')));
  zone.appendChild(el('div', 'dropzone-hint', S('filesHint')));

  var input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.style.display = 'none';

  zone.addEventListener('click', function () { input.click(); });
  zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
  zone.addEventListener('drop', function (ev) {
    ev.preventDefault();
    zone.classList.remove('is-over');
    handleDocs(ev.dataTransfer.files);
  });
  input.addEventListener('change', function () { handleDocs(input.files); input.value = ''; });

  host.appendChild(zone);
  host.appendChild(input);
  var list = el('div', 'video-list');
  list.id = 'fileList';
  host.appendChild(list);
  setTimeout(renderVideoList, 0);
  return host;
}

function handleDocs(files) {
  var all = Array.prototype.slice.call(files || []);
  if (!all.length) return;
  var tooBig = [];
  all.forEach(function (file) {
    if (!file.size || file.size > FILE_MAX_BYTES) { tooBig.push(file.name); return; }
    UPLOADS.push({
      kind: 'file', shrunk: true,
      file: file, name: file.name, size: file.size, mimeType: file.type || '', seconds: null,
      form: FORM, entryId: (FORM && FORM.id) || '', state: 'waiting', progress: 0,
      session: '', next: 0, tries: 0
    });
  });
  if (tooBig.length) toast(S('fileTooBig').replace('{names}', tooBig.join(', ')));
  uploadsAdded();
}

/** A new case study is saved as soon as something is added to it, so uploads can start. */
function uploadsAdded() {
  renderVideoList();
  if (FORM && !FORM.id) scheduleAutosave();
  pumpVideos();
}

/** How long a video is, in seconds, or null if the browser can't tell. */
function readVideoSeconds(file, done) {
  var v = document.createElement('video');
  var url = URL.createObjectURL(file);
  var finished = false;
  var end = function (s) {
    if (finished) return;
    finished = true;
    URL.revokeObjectURL(url);
    done(s);
  };
  v.preload = 'metadata';
  v.onloadedmetadata = function () { end(isFinite(v.duration) ? v.duration : null); };
  v.onerror = function () { end(null); };
  setTimeout(function () { end(null); }, 8000);
  v.src = url;
}

function handleVideos(files) {
  var all = Array.prototype.slice.call(files || []);
  if (!all.length) return;
  var form = FORM;
  var notVideo = [], tooLong = [], unknown = [];
  var pending = all.length;
  var finish = function () {
    if (--pending) return;
    var msgs = [];
    if (notVideo.length) msgs.push(S('videoNotVideo').replace('{names}', notVideo.join(', ')));
    if (tooLong.length) msgs.push(S('videoTooLong').replace('{names}', tooLong.join(', ')));
    if (unknown.length) msgs.push(S('videoCantCheck').replace('{names}', unknown.join(', ')));
    if (msgs.length) toast(msgs.join(' '));
    uploadsAdded();
  };
  all.forEach(function (file) {
    if (!/^video\//.test(file.type)) { notVideo.push(file.name); finish(); return; }
    readVideoSeconds(file, function (seconds) {
      if (seconds !== null && seconds > VIDEO_MAX_SECONDS + 1) tooLong.push(file.name);
      else if (seconds === null && file.size > VIDEO_UNKNOWN_MAX_BYTES) unknown.push(file.name);
      else if (FORM === form) {
        UPLOADS.push({
          file: file, name: file.name, size: file.size, mimeType: file.type, seconds: seconds,
          form: form, entryId: (form && form.id) || '', state: 'waiting', progress: 0,
          session: '', next: 0, tries: 0
        });
      }
      finish();
    });
  });
}

/** Starts the next video that's ready to go up (one at a time). */
function pumpVideos() {
  if (VIDEO_BUSY) { renderVideoList(); return; }
  var u = UPLOADS.filter(function (x) {
    if (x.state !== 'waiting') return false;
    if (!x.entryId && x.form && x.form.id) x.entryId = x.form.id; // saved since it was added
    return !!x.entryId;
  })[0];
  if (u) uploadVideo(u); else renderVideoList();
}

function uploadVideo(u) {
  VIDEO_BUSY = true;
  u.state = 'uploading';
  renderVideoList();
  var done = function () { VIDEO_BUSY = false; renderVideoList(); pumpVideos(); };
  var retry = function (again) {
    if (u.cancelled) return done();
    if (++u.tries < 4) { setTimeout(again, 3000); return; }
    u.state = 'failed';
    done();
  };
  var signedOut = function (err) {
    if (String(err && err.message || '').indexOf('NOT_ALLOWED') === -1) return false;
    signOut();
    return true;
  };
  var sendPiece = function () {
    if (u.cancelled) return done();
    // A save goes first, so the two don't fight over a slow connection.
    if ((FORM && FORM.busy) || (u.form && u.form.busy)) { setTimeout(sendPiece, 400); return; }
    if (u.direct !== false) return sendDirect();
    var reader = new FileReader();
    reader.onload = function () {
      google.script.run
        .withSuccessHandler(function (res) {
          u.tries = 0;
          if (!res.done) {
            u.next = res.next;
            u.progress = Math.min(99, Math.round(100 * u.next / u.size));
            renderVideoList();
            refreshVideoBlock();
            sendPiece();
            return;
          }
          u.state = 'done';
          u.progress = 100;
          videoFinished(u, res);
          done();
        })
        .withFailureHandler(function (err) { if (!signedOut(err)) retry(sendPiece); })
        .uploadVideoChunk(CODE, u.entryId, u.session, u.next, u.size, String(reader.result).split(',')[1] || '', u.kind || '');
    };
    reader.onerror = function () { retry(sendPiece); };
    reader.readAsDataURL(u.file.slice(u.next, Math.min(u.next + VIDEO_CHUNK_BYTES, u.size)));
  };
  // Straight to Drive from the page: no detour through the script, a third less
  // data, and the bar moves as the bytes go. If Drive won't take it from the page
  // (the first piece fails), the video goes the old way, through the script.
  var drawn = 0;
  var drawSoon = function () {
    var now = new Date().getTime();
    if (now - drawn < 300) return;
    drawn = now;
    renderVideoList();
    refreshVideoBlock();
  };
  var directFailed = function () {
    if (u.cancelled) return done();
    if (!u.directOk) { u.direct = false; return sendPiece(); }
    retry(askDrive); // a blip: ask Drive how much it has, then carry on
  };
  var driveReplied = function (xhr, failed) {
    if (xhr.status === 308) { // "got it, send the next piece"
      u.directOk = true;
      u.tries = 0;
      var m = /bytes=0-(\d+)/.exec(xhr.getResponseHeader('Range') || '');
      u.next = m ? Number(m[1]) + 1 : 0;
      u.progress = Math.min(99, Math.round(100 * u.next / u.size));
      renderVideoList();
      refreshVideoBlock();
      return sendPiece();
    }
    if (xhr.status === 200 || xhr.status === 201) { // the whole video is in
      var file = {};
      try { file = JSON.parse(xhr.responseText); } catch (e) { /* no id: handled below */ }
      if (!file.id) return failed();
      u.directOk = true;
      return finishDirect(file.id);
    }
    failed();
  };
  var sendDirect = function () {
    var from = u.next, to = Math.min(u.next + VIDEO_DIRECT_BYTES, u.size);
    var xhr = new XMLHttpRequest();
    try {
      xhr.open('PUT', u.session);
      xhr.setRequestHeader('Content-Range', 'bytes ' + from + '-' + (to - 1) + '/' + u.size);
    } catch (e) { return directFailed(); }
    xhr.upload.onprogress = function (ev) {
      u.progress = Math.min(99, Math.round(100 * (from + ev.loaded) / u.size));
      drawSoon();
    };
    xhr.onload = function () { driveReplied(xhr, directFailed); };
    xhr.onerror = directFailed;
    try { xhr.send(u.file.slice(from, to)); } catch (e) { directFailed(); }
  };
  var askDrive = function () {
    var xhr = new XMLHttpRequest();
    var again = function () { retry(askDrive); };
    try {
      xhr.open('PUT', u.session);
      xhr.setRequestHeader('Content-Range', 'bytes */' + u.size);
    } catch (e) { return again(); }
    xhr.onload = function () { driveReplied(xhr, again); };
    xhr.onerror = again;
    xhr.send();
  };
  var finishDirect = function (fileId) {
    google.script.run
      .withSuccessHandler(function (res) {
        u.state = 'done';
        u.progress = 100;
        videoFinished(u, res);
        done();
      })
      .withFailureHandler(function (err) { if (!signedOut(err)) retry(function () { finishDirect(fileId); }); })
      .finishVideoUpload(CODE, u.entryId, fileId, u.kind || '');
  };

  var begin = function () {
    if (u.session) return sendPiece(); // carrying on after a failed piece
    google.script.run
      .withSuccessHandler(function (res) { u.session = res.session; sendPiece(); })
      .withFailureHandler(function (err) {
        if (signedOut(err)) return;
        if (/NOT_A_VIDEO|VIDEO_TOO_LONG|VIDEO_TOO_BIG|NOT_FOUND/.test(String(err && err.message))) { u.state = 'failed'; return done(); }
        retry(begin);
      })
      .startVideoUpload(CODE, u.entryId, { kind: u.kind || '', name: u.name, mimeType: u.mimeType, size: u.size, seconds: u.seconds, origin: location.origin });
  };
  if (u.shrunk) return begin(); // carrying on after a failed try
  u.state = 'shrinking';
  u.progress = 0;
  renderVideoList();
  shrinkVideo(u, function (pct) { u.progress = pct; drawSoon(); }, function (file) {
    u.shrunk = true;
    if (file) { u.file = file; u.size = file.size; u.mimeType = file.type || u.mimeType; u.name = file.name || u.name; }
    if (u.cancelled) return done();
    u.state = 'uploading';
    u.progress = 0;
    renderVideoList();
    begin();
  });
}

function videoFinished(u, res) {
  var e = findEntry(u.entryId);
  var inForm = FORM && (u.form === FORM || FORM.id === u.entryId);
  if (u.kind === 'file') {
    if (e) { e.file_ids = res.file_ids; e.file_names = res.file_names; }
    if (inForm) KEPT_FILES.push(res.file);
  } else {
    if (e) { e.video_ids = res.video_ids; e.video_names = res.video_names; }
    if (inForm) KEPT_VIDEOS.push(res.video);
  }
  UPLOADS = UPLOADS.filter(function (x) { return x !== u; });
  refreshVideoBlock();
}

function formUploads(kind) {
  return UPLOADS.filter(function (u) {
    return FORM && (u.form === FORM || (FORM.id && u.entryId === FORM.id)) &&
      (kind === 'file') === (u.kind === 'file');
  });
}

/** Draws the videos list and the files list on the form. */
function renderVideoList() {
  drawUploadList('video');
  drawUploadList('file');
}

function drawUploadList(kind) {
  var isFile = kind === 'file';
  var host = document.getElementById(isFile ? 'fileList' : 'videoList');
  if (!host) return;
  host.innerHTML = '';
  (isFile ? KEPT_FILES : KEPT_VIDEOS).forEach(function (v) {
    host.appendChild(videoItem('is-done', v.name, S('videoDone'), 100, function () {
      if (isFile) {
        REMOVED_FILES.push(v.id);
        KEPT_FILES = KEPT_FILES.filter(function (x) { return x.id !== v.id; });
      } else {
        REMOVED_VIDEOS.push(v.id);
        KEPT_VIDEOS = KEPT_VIDEOS.filter(function (x) { return x.id !== v.id; });
      }
      renderVideoList();
      scheduleAutosave();
    }));
  });
  var busy = formUploads(kind).filter(function (u) { return u.state === 'shrinking' || u.state === 'uploading'; });
  if (busy.length) host.appendChild(el('div', 'video-note', S(isFile ? 'fileKeepOpen' : 'videoKeepOpen')));
  formUploads(kind).forEach(function (u) {
    var status = u.state === 'shrinking' ? S('videoShrinking').replace('{pct}', u.progress)
      : u.state === 'uploading' ? S('videoUploading').replace('{pct}', u.progress)
      : u.state === 'failed' ? S('videoFailed')
      : (u.entryId || (u.form && u.form.id)) ? S('videoQueued') : S('videoWaiting');
    var item = videoItem('is-' + u.state, u.name, status, u.progress, function () {
      u.cancelled = true;
      UPLOADS = UPLOADS.filter(function (x) { return x !== u; });
      renderVideoList();
    });
    if (u.state === 'failed') {
      var again = el('button', 'btn btn-ghost btn-sm', S('videoRetry'));
      again.type = 'button';
      again.addEventListener('click', function () { u.state = 'waiting'; u.tries = 0; pumpVideos(); });
      item.appendChild(again);
    }
    host.appendChild(item);
  });
}

function videoItem(cls, name, status, pct, onRemove) {
  var item = el('div', 'video-item ' + cls);
  var top = el('div', 'video-top');
  top.appendChild(el('span', 'video-name', name));
  top.appendChild(el('span', 'video-status', status));
  item.appendChild(top);
  var rm = el('button', 'link-btn', S('uploadRemove'));
  rm.type = 'button';
  rm.addEventListener('click', onRemove);
  item.appendChild(rm);
  var bar = el('div', 'video-bar');
  var fill = el('div', 'video-fill');
  fill.style.width = pct + '%';
  bar.appendChild(fill);
  item.appendChild(bar);
  return item;
}

/** The Videos block on a case study page: links that open each video in Drive. */
function fillVideoBlock(vb, e) {
  vb.innerHTML = '';
  vb.appendChild(el('h3', '', S('videos')));
  var list = videosOf(e);
  var busy = UPLOADS.filter(function (u) { return u.kind !== 'file' && u.entryId === e.id; });
  if (!list.length && !busy.length) { vb.appendChild(el('div', '', S('noVideos'))); return; }
  list.forEach(function (v) {
    var a = document.createElement('a');
    a.className = 'video-link';
    a.href = 'https://drive.google.com/file/d/' + encodeURIComponent(v.id) + '/view';
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '▶ ' + v.name;
    vb.appendChild(a);
  });
  busy.forEach(function (u) {
    vb.appendChild(el('div', 'video-status', u.name + ': ' + S('videoStillUploading').replace('{pct}', u.progress)));
  });
  if (list.length) vb.appendChild(el('div', 'video-note', S('videoOpenNote')));
}

/** The Drawings and files block on a case study page: links that open each file in Drive. */
function fillFileBlock(fb, e) {
  fb.innerHTML = '';
  fb.appendChild(el('h3', '', S('files')));
  var list = filesOf(e);
  var busy = UPLOADS.filter(function (u) { return u.kind === 'file' && u.entryId === e.id; });
  if (!list.length && !busy.length) { fb.appendChild(el('div', '', S('noFiles'))); return; }
  list.forEach(function (v) {
    var a = document.createElement('a');
    a.className = 'video-link';
    a.href = 'https://drive.google.com/file/d/' + encodeURIComponent(v.id) + '/view';
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '\uD83D\uDCC4 ' + v.name;
    fb.appendChild(a);
  });
  busy.forEach(function (u) {
    fb.appendChild(el('div', 'video-status', u.name + ': ' + S('videoStillUploading').replace('{pct}', u.progress)));
  });
  if (list.length) fb.appendChild(el('div', 'video-note', S('fileNote')));
}

function refreshVideoBlock() {
  var vb = document.getElementById('videoBlock');
  var fb = document.getElementById('fileBlock');
  if (CURRENT && !document.getElementById('viewDetail').hidden) {
    inContentLang(function () {
      if (vb) fillVideoBlock(vb, CURRENT);
      if (fb) fillFileBlock(fb, CURRENT);
    });
  }
}

// Phone photos take a second or two to shrink. Save waits for them, or it
// would save the case study without the photos just chosen.
var PREPARING = 0;
var AFTER_PHOTOS = [];

function whenPhotosReady(fn) {
  if (!PREPARING) fn(); else AFTER_PHOTOS.push(fn);
}

function photosReady() {
  var waiting = AFTER_PHOTOS;
  AFTER_PHOTOS = [];
  waiting.forEach(function (fn) { fn(); });
}

/** Redraws a photo at a smaller size so uploads stay fast and small. */
function shrink(file, maxSide, quality, done) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      done(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function () { done(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { done(null); };
  reader.readAsDataURL(file);
}

/** A small version of the first photo, stored in the sheet for the card grid. */
function makeThumb(dataUrl, done) {
  var img = new Image();
  img.onload = function () {
    var scale = Math.min(1, 360 / Math.max(img.width, img.height));
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    var q = 0.6, out = canvas.toDataURL('image/jpeg', q);
    while (out.length > 40000 && q > 0.25) {
      q -= 0.1;
      out = canvas.toDataURL('image/jpeg', q);
    }
    done(out.length > 40000 ? '' : out);
  };
  img.onerror = function () { done(''); };
  img.src = dataUrl;
}

function renderThumbs() {
  var host = document.getElementById('thumbs');
  if (!host) return;
  host.innerHTML = '';

  KEPT_PHOTOS.forEach(function (p) {
    host.appendChild(thumbNode(p.url, function () {
      REMOVED_PHOTOS.push(p.id);
      KEPT_PHOTOS = KEPT_PHOTOS.filter(function (x) { return x.id !== p.id; });
      renderThumbs();
      onFormChange();
    }));
  });

  NEW_PHOTOS.forEach(function (p, i) {
    host.appendChild(thumbNode(p.preview, function () {
      NEW_PHOTOS.splice(i, 1);
      renderThumbs();
      onFormChange();
    }));
  });
}

function thumbNode(src, onRemove) {
  var t = el('div', 'thumb');
  var img = document.createElement('img');
  img.src = src;
  t.appendChild(img);
  var b = el('button', '', S('uploadRemove'));
  b.type = 'button';
  b.addEventListener('click', onRemove);
  t.appendChild(b);
  return t;
}

// ------------------------------------------------------- values, validity

function collectValues() {
  var values = {};
  var form = document.getElementById('form');

  ['input', 'textarea', 'select'].forEach(function (tag) {
    var nodes = form.getElementsByTagName(tag);
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (!n.name || n.type === 'checkbox' || n.type === 'file') continue;
      values[n.name] = n.value;
    }
  });

  var boxes = form.querySelectorAll('.checks');
  for (var j = 0; j < boxes.length; j++) {
    var name = boxes[j].getAttribute('data-name');
    var picked = [];
    var cbs = boxes[j].getElementsByTagName('input');
    for (var k = 0; k < cbs.length; k++) if (cbs[k].checked) picked.push(cbs[k].value);
    values[name] = picked.join(', ');
  }

  // A "type it here" answer only counts while Other is actually picked.
  if (BOOT) BOOT.fields.forEach(function (f) {
    var k = f.key + '_other';
    if (!(k in values)) return;
    var chosen = String(values[f.key] || '').split(',').map(function (v) { return v.trim(); });
    if (chosen.indexOf('other') === -1) values[k] = '';
  });
  return values;
}

/** Same rules as computeReadiness_ on the server, so the meter never lies. */
function missingFields(values) {
  var missing = [];
  function filled(key) { return String(values[key] || '').trim().length > 0; }

  BOOT.fields.forEach(function (f) {
    if (!f.required) return;
    if (f.type === 'files') {
      if (!KEPT_PHOTOS.length && !NEW_PHOTOS.length) missing.push(f.key);
      return;
    }
    if (f.bilingual) {
      if (!filled(f.key + '_en') && !filled(f.key + '_ar')) missing.push(f.key);
      return;
    }
    if (!filled(f.key)) missing.push(f.key);
  });
  return missing;
}

function updateReadiness() {
  var missing = missingFields(mergePending());
  var box = document.getElementById('readiness');
  box.innerHTML = '';
  box.classList.toggle('is-ready', missing.length === 0);

  var head = el('strong', '', S('readyTitle') + ': ');
  box.appendChild(head);

  if (!missing.length) {
    box.appendChild(document.createTextNode(S('readyYes')));
    return;
  }
  box.appendChild(document.createTextNode(S('readyNo')));
  var ul = document.createElement('ul');
  missing.forEach(function (k) { ul.appendChild(el('li', '', FT(k, 'label'))); });
  box.appendChild(ul);
}

var draftTimer = null;

function isMetricSide(key) { return key === 'metric_before' || key === 'metric_after'; }

/** The before/after help, with an example that matches the number picked above. */
function metricExample(key) {
  var sel = document.querySelector('select[name="metric_type"]');
  var type = (sel && sel.value) || 'lead_time';
  var packs = (BOOT && BOOT.strings) || PRELOAD_STRINGS;
  var p = packs[LANG] || packs.en;
  var side = key === 'metric_before' ? 'exBefore_' : 'exAfter_';
  return p[side + type] || p[side + 'lead_time'];
}

function metricHelp(key) {
  return FT(key, 'help').replace('{example}', metricExample(key));
}

function refreshMetricHelp() {
  ['metric_before', 'metric_after'].forEach(function (k) {
    var h = document.querySelector('[data-metric-help="' + k + '"]');
    if (h) h.textContent = metricHelp(k);
    var box = document.querySelector('#form [name="' + k + '_' + LANG + '"]');
    if (box) box.placeholder = metricExample(k);
  });
}

function onFormChange() {
  refreshMetricHelp();
  updateReadiness();
  scheduleAutosave();
  saveDraft();
}

/**
 * Every change is also copied into this browser straight away, so a refresh or
 * a dropped connection never loses what was typed. It's cleared once Google has it.
 */
function saveDraft() {
  if (!FORM) return;
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ id: FORM.id, key: FORM.key, values: PENDING })); } catch (e) {}
}

function draftRecord() {
  try {
    var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (d && !d.values) d = { id: '', values: d }; // copies kept by the older version
    return d;
  } catch (e) { return null; }
}

/** The browser's copy for this case study ('' = a new one), or null. */
function readDraft(id) {
  var d = draftRecord();
  return d && (d.id || '') === (id || '') ? d.values : null;
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}

// ------------------------------------------------------- saving as you type
// Like Google Docs: a few seconds after someone stops typing, the case study is
// saved. Only the client name and what we made are needed before the first save.
// Leaving the form, or pressing Save, saves straight away.

var AUTOSAVE_MS = 2500;
var FORM = null; // the form that's open: {id, state, timer, busy, queued, dirty}

function newFormSession(id, key) {
  // key: this form's own name until the case study has an id, so sending it
  // twice (a refresh before the page heard back) never makes two.
  key = key || ('f' + new Date().getTime().toString(36) + Math.random().toString(36).slice(2, 10));
  return { id: id || '', key: key, state: '', timer: null, busy: false, queued: null, dirty: false };
}

function copyObj(o) { return JSON.parse(JSON.stringify(o)); }

function basicsMissing(values) {
  // Only these two block a save. Everything else (photos included) can be added
  // later - the entry just shows as "Needs info" until then.
  var has = function (k) { return String((values || {})[k] || '').trim() !== ''; };
  var missing = [];
  if (!has('client_name')) missing.push('client_name');
  if (!has('part_made_en') && !has('part_made_ar')) missing.push('part_made');
  return missing;
}

function setSaveState(state) {
  if (FORM) FORM.state = state;
  var n = document.getElementById('saveState');
  if (!n) return;
  var key = { saving: 'saveStateSaving', saved: 'saveStateSaved', needBasics: 'saveStateNeedBasics', failed: 'saveStateFailed' }[state];
  n.className = 'save-state' + (state ? ' is-' + state : '');
  n.textContent = key ? S(key) : '';
}

function scheduleAutosave() {
  if (!FORM) return;
  FORM.dirty = true;
  clearTimeout(FORM.timer);
  FORM.timer = setTimeout(function () { saveNow(true); }, AUTOSAVE_MS);
}

/** Saving the form a moment before leaving it, so nothing typed is lost. */
function leaveForm() {
  var f = FORM;
  if (f && !document.getElementById('viewForm').hidden && (f.dirty || f.timer)) saveNow(false);
  FORM = null;
}

window.addEventListener('beforeunload', function (ev) {
  // A video can't carry on uploading once the page is gone.
  if (videosUploading()) { ev.preventDefault(); ev.returnValue = ''; }
  if (!FORM) return;
  // Text is safe either way: the browser keeps a copy, and it comes back after
  // a refresh. Only ask "are you sure" when photos haven't reached Google yet.
  var photosNotUp = PREPARING || NEW_PHOTOS.some(function (p) { return !p.sent; }) ||
    (FORM.busy && NEW_PHOTOS.length);
  saveDraft();
  if (FORM.dirty || FORM.timer) saveNow(true);
  if (photosNotUp) {
    ev.preventDefault();
    ev.returnValue = '';
  }
});

/**
 * Sends what's on the form now. autosave=true while typing; false when leaving
 * the form or pressing Save (the server then also tells marketing, once).
 * after(saved) runs when it's done. Returns false if the basics are missing.
 */
function saveNow(autosave, after) {
  var f = FORM;
  if (!f) return false;
  clearTimeout(f.timer);
  f.timer = null;
  var values = copyObj(mergePending());
  if (basicsMissing(values).length) { setSaveState('needBasics'); return false; }
  f.dirty = false;

  var photos = NEW_PHOTOS.filter(function (p) { return !p.sent; });
  photos.forEach(function (p) { p.sent = true; });
  var removed = REMOVED_PHOTOS.slice();
  var job = {
    values: values, autosave: !!autosave, after: after || null, photos: photos, removed: removed,
    removedVideos: REMOVED_VIDEOS.slice(),
    removedFiles: REMOVED_FILES.slice(),
    thumbSource: (photos.length || removed.length)
      ? (NEW_PHOTOS.length ? NEW_PHOTOS[0].preview : (KEPT_PHOTOS.length ? KEPT_PHOTOS[0].url : ''))
      : null
  };
  // One save at a time, so a new case study is never created twice.
  if (f.busy) { f.queued = f.queued ? mergeJobs(f.queued, job) : job; return true; }
  runSave(f, job);
  return true;
}

function mergeJobs(older, newer) {
  return {
    values: newer.values,
    autosave: older.autosave && newer.autosave,
    after: newer.after || older.after,
    photos: older.photos.concat(newer.photos),
    removed: older.removed.concat(newer.removed.filter(function (x) { return older.removed.indexOf(x) === -1; })),
    removedVideos: older.removedVideos.concat(newer.removedVideos.filter(function (x) { return older.removedVideos.indexOf(x) === -1; })),
    removedFiles: older.removedFiles.concat(newer.removedFiles.filter(function (x) { return older.removedFiles.indexOf(x) === -1; })),
    thumbSource: newer.thumbSource !== null ? newer.thumbSource : older.thumbSource
  };
}

function runSave(f, job) {
  f.busy = true;
  if (f === FORM) setSaveState('saving');
  var send = function (thumb) {
    google.script.run
      .withSuccessHandler(function (saved) { onSavedNow(f, job, saved); })
      .withFailureHandler(function (err) { onSaveNowFailed(f, job, err); })
      .saveEntry(CODE, {
        id: f.id,
        draftKey: f.key,
        values: job.values,
        newPhotos: job.photos.map(function (p) {
          return { name: p.name, mimeType: p.mimeType, dataBase64: p.dataBase64 };
        }),
        removePhotoIds: job.removed,
        removeVideoIds: job.removedVideos,
        removeFileIds: job.removedFiles,
        thumb: thumb,
        autosave: job.autosave
      });
  };
  if (job.thumbSource) makeThumb(job.thumbSource, send); else send('');
}

function onSavedNow(f, job, saved) {
  f.busy = false;
  var wasNew = !f.id;
  f.id = saved.id;
  // Google has it now, so the browser's copy can go (unless more was typed since).
  var d = draftRecord();
  if (d && (d.id === saved.id || (wasNew && !d.id)) && (f !== FORM || !f.dirty)) clearDraft();
  if (f === FORM && wasNew) rememberScreen({ view: 'form', id: saved.id });
  var i = -1;
  for (var j = 0; j < ENTRIES.length; j++) if (ENTRIES[j].id === saved.id) i = j;
  if (i > -1) ENTRIES[i] = saved; else ENTRIES.push(saved);
  delete PHOTO_CACHE[saved.id];

  if (f === FORM) {
    // Photos that just went up are now part of the case study.
    var ids = String(saved.photo_ids || '').split(',').filter(String);
    var newIds = ids.slice(ids.length - job.photos.length);
    job.photos.forEach(function (p, n) {
      var at = NEW_PHOTOS.indexOf(p);
      if (at > -1) {
        NEW_PHOTOS.splice(at, 1);
        KEPT_PHOTOS.push({ id: newIds[n], name: p.name, url: p.preview });
      } else {
        REMOVED_PHOTOS.push(newIds[n]); // removed while it was uploading
      }
    });
    REMOVED_PHOTOS = REMOVED_PHOTOS.filter(function (x) { return job.removed.indexOf(x) === -1; });
    REMOVED_VIDEOS = REMOVED_VIDEOS.filter(function (x) { return job.removedVideos.indexOf(x) === -1; });
    REMOVED_FILES = REMOVED_FILES.filter(function (x) { return job.removedFiles.indexOf(x) === -1; });
    if (job.photos.length) renderThumbs();
    if (REMOVED_PHOTOS.length) scheduleAutosave();
  }
  buildFilters();
  renderLibrary();
  pumpVideos(); // videos and files added before the case study existed can go up now

  if (f.queued) { var q = f.queued; f.queued = null; runSave(f, q); return; }
  if (f === FORM) setSaveState(f.dirty ? 'saving' : 'saved');
  if (job.after && f === FORM) job.after(saved);
}

function onSaveNowFailed(f, job, err) {
  if (String(err && err.message || '').indexOf('NOT_ALLOWED') > -1) { f.busy = false; signOut(); return; }
  // Keep it and try again in a bit, with anything typed since. f.busy stays on
  // meanwhile, so nothing else is sent at the same time.
  f.queued = f.queued ? mergeJobs(job, f.queued) : job;
  if (f === FORM) {
    setSaveState('failed');
    if (job.after) {
      resetSaveButton();
      document.getElementById('formMsg').textContent = S('errSaveFailed');
    }
  }
  setTimeout(function () { var q = f.queued; f.queued = null; runSave(f, q); }, 10000);
}

function resetSaveButton() {
  var btn = document.getElementById('saveBtn');
  btn.disabled = false;
  btn.textContent = S('save');
}

// ------------------------------------------------------------------- save

function submitForm(ev) {
  ev.preventDefault();
  var values = mergePending();
  var missing = basicsMissing(values);

  var fields = document.querySelectorAll('.field');
  for (var i = 0; i < fields.length; i++) fields[i].classList.remove('has-error');

  if (missing.length) {
    missing.forEach(function (k) {
      var node = document.querySelector('.field[data-key="' + k + '"]');
      if (node) node.classList.add('has-error');
    });
    var first = document.querySelector('.field.has-error');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.getElementById('formMsg').textContent = S('readyNo') + ' ' +
      missing.map(function (k) { return FT(k, 'label'); }).join(', ');
    return;
  }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = S('saving');
  whenPhotosReady(function () { saveNow(false, onSaved); });
}

/** After Save: open the case study that was just saved. */
function onSaved(saved) {
  resetSaveButton();
  clearDraft();
  FORM = null;
  PENDING = {};
  NEW_PHOTOS = [];
  REMOVED_PHOTOS = [];
  EDITING = null;
  navTo({ view: 'detail', id: saved.id });
  toast(saved.id + ' ✓');
}

function doDelete(entry) {
  if (!window.confirm(S('deleteConfirm'))) return;
  google.script.run
    .withSuccessHandler(function () {
      ENTRIES = ENTRIES.filter(function (e) { return e.id !== entry.id; });
      buildFilters();
      renderLibrary();
      toast(S('deleted'));
      navTo({ view: 'library' });
    })
    .withFailureHandler(function (err) {
      if (String(err && err.message || '').indexOf('NOT_ALLOWED') > -1) { signOut(); return; }
      toast(S('errSaveFailed'));
    })
    .deleteEntry(CODE, entry.id);
}

// ------------------------------------------------------------------ wiring

function wireShell() {
  document.getElementById('langToggle').addEventListener('click', toggleLanguage);
  document.getElementById('signInForm').addEventListener('submit', signIn);
  document.getElementById('signOutBtn').addEventListener('click', askSignOut);
}

function wireUp() {
  var toLibrary = function () { navTo({ view: 'library' }); };
  document.getElementById('tabLibrary').addEventListener('click', toLibrary);
  document.getElementById('tabAdd').addEventListener('click', function () { navTo({ view: 'form', id: null }); });
  document.getElementById('detailBack').addEventListener('click', toLibrary);
  document.getElementById('formBack').addEventListener('click', toLibrary);
  document.getElementById('cancelBtn').addEventListener('click', toLibrary);
  document.getElementById('navBack').addEventListener('click', navBack);
  document.getElementById('navForward').addEventListener('click', navForward);
  document.getElementById('form').addEventListener('submit', submitForm);

  document.getElementById('search').addEventListener('input', renderLibrary);
  ['fCapability', 'fIndustry', 'fStatus', 'fYear'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', renderLibrary);
  });
  document.getElementById('clearFilters').addEventListener('click', function () {
    document.getElementById('search').value = '';
    ['fCapability', 'fIndustry', 'fStatus', 'fYear'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    renderLibrary();
  });

  document.getElementById('optionalToggle').addEventListener('click', function () {
    var box = document.getElementById('groupOptional');
    box.hidden = !box.hidden;
    this.textContent = box.hidden ? S('optionalToggleShow') : S('optionalToggleHide');
  });
}
</script>
